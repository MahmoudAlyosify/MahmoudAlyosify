name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install heatmap dependencies
        run: pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Fetch public contribution calendar
        env:
          GH_USERNAME: MahmoudAlyosify
        run: python scripts/fetch_contributions.py
      - name: Render animated SVG
        run: python scripts/render_heatmap_svg.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution heatmap"
          file_pattern: "contrib-heatmap.svg data/contributions.json"
